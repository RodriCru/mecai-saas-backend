services:
  postgres:
    image: postgres:17-alpine
    container_name: car-java-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-car_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-car_user_123}
      POSTGRES_DB: ${POSTGRES_DB:-car_bd}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mudarte} -d ${POSTGRES_DB:-mudarte}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data: