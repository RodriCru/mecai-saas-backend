service:
  database:
    image: postgres:18-alpine
    container_name: car-java-dev
    enviroment:
      POSTGRES_USER: car_user
      POSTGRES_PASSWORD: car_user_123
      POSTGRES_DB: car_bd
    ports:
      - "5432:5432"
    volumes:
      - ./postgres_data:​/var/lib/postgresql/data
    networks:
      - backend-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin_user -d enterprise_db"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  backend-network:
    driver: bridge

volumes:
  postgres_data: