spring.application.name=car
jwt.secret=${JWT_SECRET}
jwt.access-token-expiration=${JWT_ACCESS_EXPIRATION}
jwt.refresh-token-expiration=${JWT_REFRESH_EXPIRATION}
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.config.import=optional:file:.env[.properties]

seed.superadmin.email=${SEED_SUPERADMIN_EMAIL:}
seed.superadmin.password=${SEED_SUPERADMIN_PASSWORD:}

resend.key=${RESEND_API_KEY}
resend.email=${RESEND_EMAIL}
